name: CI (Offline Checks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_CALLS_ENABLED: "false"
  APP_ENV: "test"

jobs:
  frontend:
    name: Frontend (Typecheck, Lint, Unit & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest unit & component tests
        run: npm test

      - name: Production bundle build check
        run: npm run build

  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint check
        run: uv run ruff check backend/src tests

  backend:
    name: Backend Offline Pytest (Shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: paradedb/paradedb:0.26.1-pg17@sha256:c1c147499c6649739d7977f1e47db149578c894f35249953acdd7680ccbae75b
        env:
          PDB_TUNE: "false"
          POSTGRES_USER: knowledgeops
          POSTGRES_PASSWORD: knowledgeops
          POSTGRES_DB: knowledgeops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knowledgeops -d knowledgeops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://knowledgeops:knowledgeops@localhost:5432/knowledgeops
      ACCOUNTING_DATABASE_URL: postgresql+psycopg://knowledgeops:knowledgeops@localhost:5432/knowledgeops_accounting
      TEST_DATABASE_URL: postgresql+psycopg://knowledgeops:knowledgeops@localhost:5432/knowledgeops_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      RUNTIME_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      OPENAI_BASE_URL: https://api.deepseek.com
      PYTEST_SHARD_INDEX: ${{ matrix.shard }}
      PYTEST_SHARD_TOTAL: "6"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install OCR & CJK font system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim fonts-noto-cjk

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --frozen --group dev

      - name: Initialize isolated databases and bundled skills
        run: |
          uv run python -c "from pathlib import Path; import psycopg; conn = psycopg.connect('postgresql://knowledgeops:knowledgeops@localhost:5432/knowledgeops', autocommit=True); [conn.execute(stmt) for stmt in Path('infra/postgres-init.sql').read_text(encoding='utf-8').split(';') if stmt.strip()]; conn.close()"
          uv run alembic upgrade head
          uv run python scripts/initialize_skills.py

      - name: Offline pytest suite (shard ${{ matrix.shard }}/6, zero paid model calls)
        run: uv run pytest -m "not online"
